$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
body:
  type: urlencoded
  content:
    username: admin@podclub.io
    password: ChangeMe123!
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const r = pm.response.json();
      pm.test("login ok", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("token", r.access_token);
    language: text/javascript
order: 2000
