  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "newuser_{{$timestamp}}",
      "email": "newuser_{{$timestamp}}@podclub.io",
      "password": "Password123!"
    }
auth:
  type: noauth
order: 1000
