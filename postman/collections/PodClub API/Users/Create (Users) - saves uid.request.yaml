$kind: http-request
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "postman_{{$timestamp}}",
      "email": "postman_{{$timestamp}}@podclub.io",
      "password": "Password123!",
      "role_id": {{user_role_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status ok", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      const d = pm.response.json().data;
      if (d && d.uid) {
        pm.collectionVariables.set("uid", d.uid);
        pm.collectionVariables.set("user_uid", d.uid);
      }
      if (d && d.id) {
        pm.collectionVariables.set("id", d.id);
        pm.collectionVariables.set("user_id", d.id);
      }
    language: text/javascript
order: 2000
